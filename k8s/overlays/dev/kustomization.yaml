apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messenger-dev

resources:
  - ../../base

images:
  - name: mablinov2704/frontend
    newTag: latest
  - name: mablinov2704/bff
    newTag: latest
  - name: mablinov2704/user-service
    newTag: latest
  - name: mablinov2704/message-service
    newTag: latest

replicas:
  - name: frontend
    count: 1
  - name: bff
    count: 1
  - name: user-service
    count: 1
  - name: message-service
    count: 1

patches:
  - path: patches/csi-endpoint.yaml
  - path: patches/storageclass-ns.yaml
  - path: patches/ingress-host.yaml
  - path: patches/resources.yaml
    target:
      kind: Deployment
  - path: patches/message-service-affinity.yaml
