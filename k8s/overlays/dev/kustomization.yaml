apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# отдельное пространство имён для dev-окружения
namespace: messenger-dev

# берём общий рецепт целиком
resources:
  - ../../base

# теги образов: в dev используем подвижный latest
images:
  - name: mablinov2704/frontend
    newTag: latest
  - name: mablinov2704/bff
    newTag: latest
  - name: mablinov2704/user-service
    newTag: latest
  - name: mablinov2704/message-service
    newTag: latest

# в dev по одной копии каждого сервиса
replicas:
  - name: frontend
    count: 1
  - name: bff
    count: 1
  - name: user-service
    count: 1
  - name: message-service
    count: 1

# точечные правки
patches:
  # S3 CSI: namespace секрета и эндпоинт MinIO под messenger-dev
  - path: patches/csi-endpoint.yaml
  - path: patches/storageclass-ns.yaml
  # внешний домен dev
  - path: patches/ingress-host.yaml
  # маленькие ресурсы всем Deployment'ам
  - path: patches/resources.yaml
    target:
      kind: Deployment
  # dev мягче: убираем soft-предпочтение disk=fast у message-service
  - path: patches/message-service-affinity.yaml
