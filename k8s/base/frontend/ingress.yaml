apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: messenger
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # k3d поставляется с Traefik как ingress-контроллером
  ingressClassName: traefik
  rules:
    # host переопределяется в overlay'ах (dev/prod)
    - host: messenger.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
