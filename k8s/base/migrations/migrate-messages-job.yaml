apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-messages
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: migrate-messages
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["app"]
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - "until pg_isready -h postgres -p 5432; do echo waiting-db; sleep 2; done"
        - name: copy-migrations
          image: mablinov2704/message-service:latest
          command: ["sh", "-c", "cp -r /app/migrations/. /migrations/"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: goose
          image: ghcr.io/kukymbr/goose-docker:latest
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: MESSAGE_DB_DSN
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          emptyDir: {}
