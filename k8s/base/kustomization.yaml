apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messenger

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: messenger

resources:
  - namespace.yaml
  - config/app-config.yaml
  - config/postgres-secret.yaml
  - config/app-db-secret.yaml
  - config/minio-secret.yaml
  - config/csi-s3-secret.yaml
  - postgres/configmap-initdb.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - minio/deployment.yaml
  - minio/service.yaml
  - minio/setup-job.yaml
  - s3-csi/storageclass.yaml
  - s3-csi/pvc.yaml
  - migrations/migrate-users-job.yaml
  - migrations/migrate-messages-job.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - message-service/deployment.yaml
  - message-service/service.yaml
  - bff/deployment.yaml
  - bff/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml
