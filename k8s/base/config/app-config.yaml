apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # --- HTTP-порты сервисов (по EXPOSE из образов) ---
  BFF_HTTP_PORT: "8080"
  USER_SERVICE_HTTP_PORT: "8081"
  MESSAGE_SERVICE_HTTP_PORT: "8082"
  # --- Внутрикластерные адреса (DNS сервисов в том же namespace) ---
  BFF_INTERNAL_URL: "http://bff:8080"
  BFF_URL: ""
  USER_SERVICE_URL: "http://user-service:8081"
  MSG_SERVICE_URL: "http://message-service:8082"
  # --- Файловое хранилище (точка монтирования S3 CSI) ---
  UPLOADS_DIR: "/app/uploads"
