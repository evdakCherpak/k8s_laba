apiVersion: v1
kind: Secret
metadata:
  name: csi-s3-secret
type: Opaque
stringData:
  accessKeyID: minioadmin
  secretAccessKey: minioadmin123
  # Эндпоинт MinIO для GeeseFS. По умолчанию — ClusterIP-DNS в namespace base.
  # В overlay'ах namespace другой → endpoint патчится (см. overlays/*/patches).
  endpoint: http://minio.messenger.svc.cluster.local:9000
